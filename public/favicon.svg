<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Golden Rounded Badge identical to the app's top header logo -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#goldBadge)" stroke="#fde68a" stroke-width="6" stroke-opacity="0.6" filter="url(#shadow)"/>

  <!-- Bold Greek Capital Sigma Σ in pure black -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="900" font-size="340"
        fill="#000000">Σ</text>
</svg>
