<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background titanium gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- LCD screen gradient -->
    <linearGradient id="lcdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2ebd8"/>
      <stop offset="100%" stop-color="#cfdcc5"/>
    </linearGradient>

    <!-- Golden key gradient -->
    <linearGradient id="goldKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Cyan key gradient -->
    <linearGradient id="cyanKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Dark button gradient -->
    <linearGradient id="darkKey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Calculator Body Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bodyGrad)" stroke="#475569" stroke-width="4" filter="url(#shadow)"/>

  <!-- Top Natural Display LCD Screen -->
  <rect x="64" y="64" width="384" height="136" rx="20" fill="#000000" stroke="#334155" stroke-width="3"/>
  <rect x="70" y="70" width="372" height="124" rx="16" fill="url(#lcdGrad)" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- LCD Screen Content: "fx-991EX" badge & fraction expression -->
  <text x="92" y="112" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" font-style="italic" fill="#1e293b">fx</text>
  <text x="136" y="102" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#475569">991EX</text>
  
  <!-- Math Fraction in LCD: √x / 2π -->
  <text x="290" y="116" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="30" fill="#0f172a" text-anchor="middle">√x²</text>
  <line x1="240" y1="130" x2="340" y2="130" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
  <text x="290" y="166" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="30" fill="#0f172a" text-anchor="middle">2π</text>

  <!-- Equal sign & Ans on right -->
  <text x="390" y="148" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" fill="#0369a1" text-anchor="middle">=</text>

  <!-- Keypad Area: 4x3 sleek rounded buttons -->
  <!-- Row 1: Function / Gold keys -->
  <rect x="64" y="232" width="76" height="48" rx="12" fill="url(#goldKey)"/>
  <text x="102" y="264" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#000" text-anchor="middle">SHIFT</text>

  <rect x="166" y="232" width="76" height="48" rx="12" fill="#e11d48"/>
  <text x="204" y="264" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#fff" text-anchor="middle">ALPHA</text>

  <rect x="268" y="232" width="76" height="48" rx="12" fill="url(#darkKey)"/>
  <text x="306" y="264" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#94a3b8" text-anchor="middle">x²</text>

  <rect x="370" y="232" width="76" height="48" rx="12" fill="url(#darkKey)"/>
  <text x="408" y="264" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#94a3b8" text-anchor="middle">∫</text>

  <!-- Row 2: Math keys -->
  <rect x="64" y="302" width="76" height="48" rx="12" fill="url(#darkKey)"/>
  <text x="102" y="334" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#f8fafc" text-anchor="middle">sin</text>

  <rect x="166" y="302" width="76" height="48" rx="12" fill="url(#darkKey)"/>
  <text x="204" y="334" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#f8fafc" text-anchor="middle">cos</text>

  <rect x="268" y="302" width="76" height="48" rx="12" fill="url(#darkKey)"/>
  <text x="306" y="334" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#f8fafc" text-anchor="middle">tan</text>

  <rect x="370" y="302" width="76" height="48" rx="12" fill="#dc2626"/>
  <text x="408" y="334" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#fff" text-anchor="middle">DEL</text>

  <!-- Row 3: Operation / Equal keys -->
  <rect x="64" y="372" width="76" height="54" rx="14" fill="url(#darkKey)"/>
  <text x="102" y="407" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#f8fafc" text-anchor="middle">7</text>

  <rect x="166" y="372" width="76" height="54" rx="14" fill="url(#darkKey)"/>
  <text x="204" y="407" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#f8fafc" text-anchor="middle">8</text>

  <rect x="268" y="372" width="76" height="54" rx="14" fill="url(#darkKey)"/>
  <text x="306" y="407" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#f8fafc" text-anchor="middle">9</text>

  <rect x="370" y="372" width="76" height="54" rx="14" fill="url(#cyanKey)"/>
  <text x="408" y="409" font-family="system-ui, sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle">=</text>
</svg>
