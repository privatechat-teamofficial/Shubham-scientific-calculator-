name: Build & Publish GitHub Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-apk-build
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete previous workflow runs except latest
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up old workflow runs..."
          CURRENT_RUN="${{ github.run_id }}"
          for RUN_ID in $(gh run list --limit 100 --json databaseId -q '.[].databaseId' 2>/dev/null || true); do
            if [ "$RUN_ID" != "$CURRENT_RUN" ]; then
              echo "Deleting old workflow run: $RUN_ID"
              gh run delete "$RUN_ID" 2>/dev/null || true
            fi
          done

      - name: Delete all previous releases and old tags
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=========================================================="
          echo "Deleting all old releases so only v1.0.0 remains"
          echo "=========================================================="
          # Delete all existing releases except v1.0.0 (or delete prior runs)
          for TAG in $(gh release list --limit 100 --json tagName -q '.[].tagName' 2>/dev/null || true); do
            if [ "$TAG" != "v1.0.0" ]; then
              echo "Deleting old release and tag: $TAG"
              gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            fi
          done

          # Clean up any build-* git tags on remote
          for OLD_TAG in $(git tag -l "build-*" 2>/dev/null || true); do
            echo "Deleting remote tag: $OLD_TAG"
            git push origin --delete "$OLD_TAG" 2>/dev/null || true
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          npm install

      - name: Build Web Bundle & Android APK
        run: |
          python3 build-apk.py

      - name: Verify APK Generated
        run: |
          echo "Verifying generated build artifacts..."
          ls -la APK_DOWNLOAD/
          ls -la .build-outputs/
          if [ ! -f APK_DOWNLOAD/SHUBHAM-Scientific-Calculator.apk ]; then
            echo "ERROR: APK_DOWNLOAD/SHUBHAM-Scientific-Calculator.apk does not exist!"
            exit 1
          fi
          if [ ! -s APK_DOWNLOAD/SHUBHAM-Scientific-Calculator.apk ]; then
            echo "ERROR: APK_DOWNLOAD/SHUBHAM-Scientific-Calculator.apk is empty (0B)!"
            exit 1
          fi
          echo "SUCCESS: APK_DOWNLOAD/SHUBHAM-Scientific-Calculator.apk verified successfully ($(stat -c%s APK_DOWNLOAD/SHUBHAM-Scientific-Calculator.apk) bytes)."

      - name: Publish GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: SHUBHAM Scientific Calculator v1.0.0
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ### 📱 SHUBHAM Scientific Calculator v1.0.0

            Official first production release of **SHUBHAM Scientific Calculator**.

            #### ✨ Key Features
            - **Natural Textbook Display**: Multi-tier fraction rendering, superscripts, root exponents, and clean mathematical formatting.
            - **Exact & Decimal Evaluation**: Live calculation, exact radical/fraction answers, and one-tap S⇔D toggling.
            - **Ergonomic Keypad & Ans Functionality**: Dedicated Ans key that erases previous expressions to start fresh with your latest calculated output.
            - **Calculus & Linear Algebra**: Numerical integration, differentiation, equation solvers, and comprehensive constant/unit conversions.
            - **Offline-Ready Android APK**: Standalone signed APK for instant installation on any Android device.

            #### 📦 Release Assets
            - 🚀 **`SHUBHAM-Scientific-Calculator.apk`**: Direct Android APK installable application.
            - 📦 **`SHUBHAM-Calculator-App.zip`**: Complete offline source code and assets archive.
          files: |
            APK_DOWNLOAD/SHUBHAM-Scientific-Calculator.apk
            SHUBHAM-Calculator-App.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
