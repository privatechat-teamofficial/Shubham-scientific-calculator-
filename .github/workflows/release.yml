name: Build & Publish GitHub Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'SHUBHAM Scientific Calculator - Latest APK Release'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          npm install

      - name: Build Web Bundle & Compile Android APK
        run: |
          python3 build-apk.py

      - name: Verify APK & Assets Generated
        run: |
          ls -lh APK_DOWNLOAD/
          ls -lh .build-outputs/
          test -f APK_DOWNLOAD/app-debug.apk || (echo "APK not found!" && exit 1)

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            APK_DOWNLOAD/app-debug.apk
            SHUBHAM-Calculator-App.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
