name: Build & Publish GitHub Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          npm install

      - name: Build Web Bundle & Android APK
        run: |
          python3 build-apk.py

      - name: Verify APK Generated
        run: |
          echo "Verifying generated build artifacts..."
          ls -la APK_DOWNLOAD/
          ls -la .build-outputs/
          if [ ! -f APK_DOWNLOAD/app-debug.apk ]; then
            echo "ERROR: APK_DOWNLOAD/app-debug.apk does not exist!"
            exit 1
          fi
          if [ ! -s APK_DOWNLOAD/app-debug.apk ]; then
            echo "ERROR: APK_DOWNLOAD/app-debug.apk is empty (0B)!"
            exit 1
          fi
          echo "SUCCESS: APK_DOWNLOAD/app-debug.apk verified successfully ($(stat -c%s APK_DOWNLOAD/app-debug.apk) bytes)."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SHUBHAM Scientific Calculator - Build ${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            APK_DOWNLOAD/app-debug.apk
            SHUBHAM-Calculator-App.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
